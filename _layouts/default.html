<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ site.title }} · {{ site.tagline }}</title>
<meta name="description" content="{{ site.description | strip_newlines }}">
<meta property="og:title" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description | strip_newlines }}">
<meta property="og:image" content="{{ site.url }}{{ '/assets/img/rishika.jpg' | relative_url }}">
<meta name="theme-color" content="#cf2c63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400..800;1,400..800&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
{% include stickers.html %}
{{ content }}
<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
